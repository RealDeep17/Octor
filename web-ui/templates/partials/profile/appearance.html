{{ define "profile/appearance" }}

                <div class="absolute inset-0 bg-white"></div>

<div class="card bg-base-300/50 border border-o-line p-5 sm:p-7 rounded-2xl mt-6">
    <div class="max-w-[780px]">
        <h3 class="text-[clamp(1.2rem,3vw,1.5rem)] font-bold tracking-tight mb-2">Grid Density</h3>
        <p class="text-o-sub text-sm mb-6">Control how many items are displayed per row on large screens.</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Default (Low) -->
            <button onclick="setDensity('default')" class="density-btn p-4 rounded-xl border-2 border-o-line hover:border-o-primary transition-all text-left" data-density-id="default">
                <div class="text-xs font-bold uppercase tracking-widest text-o-muted mb-1">Low</div>
                <div class="text-sm font-bold text-w-text mb-2">2 Horiz / 4 Vert</div>
                <div class="flex gap-1 opacity-40">
                    <div class="w-4 h-6 rounded bg-o-line"></div>
                    <div class="w-4 h-6 rounded bg-o-line"></div>
                </div>
            </button>

            <!-- Medium -->
            <button onclick="setDensity('medium')" class="density-btn p-4 rounded-xl border-2 border-o-line hover:border-o-primary transition-all text-left" data-density-id="medium">
                <div class="text-xs font-bold uppercase tracking-widest text-o-muted mb-1">Medium</div>
                <div class="text-sm font-bold text-w-text mb-2">3 Horiz / 6 Vert</div>
                <div class="flex gap-1 opacity-60">
                    <div class="w-3 h-5 rounded bg-o-line"></div>
                    <div class="w-3 h-5 rounded bg-o-line"></div>
                    <div class="w-3 h-5 rounded bg-o-line"></div>
                </div>
            </button>

            <!-- High (Gorgeous) -->
            <button onclick="setDensity('high')" class="density-btn p-4 rounded-xl border-2 border-o-line hover:border-o-primary transition-all text-left" data-density-id="high">
                <div class="text-xs font-bold uppercase tracking-widest text-o-primary mb-1">High</div>
                <div class="text-sm font-bold text-w-text mb-2">4 Horiz / 8 Vert</div>
                <div class="flex gap-1">
                    <div class="w-2.5 h-4 rounded bg-o-primary/40"></div>
                    <div class="w-2.5 h-4 rounded bg-o-primary/40"></div>
                    <div class="w-2.5 h-4 rounded bg-o-primary/40"></div>
                    <div class="w-2.5 h-4 rounded bg-o-primary/40"></div>
                </div>
            </button>

            <!-- Ultra (Compact) -->
            <button onclick="setDensity('ultra')" class="density-btn p-4 rounded-xl border-2 border-o-line hover:border-o-primary transition-all text-left" data-density-id="ultra">
                <div class="text-xs font-bold uppercase tracking-widest text-o-cyan mb-1">Ultra</div>
                <div class="text-sm font-bold text-w-text mb-2">5 Horiz / 10 Vert</div>
                <div class="flex gap-0.5">
                    <div class="w-2 h-3.5 rounded bg-o-cyan/40"></div>
                    <div class="w-2 h-3.5 rounded bg-o-cyan/40"></div>
                    <div class="w-2 h-3.5 rounded bg-o-cyan/40"></div>
                    <div class="w-2 h-3.5 rounded bg-o-cyan/40"></div>
                    <div class="w-2 h-3.5 rounded bg-o-cyan/40"></div>
                </div>
            </button>
        </div>
    </div>
</div>

<script>
    function setSkin(id) {
        localStorage.setItem('octor-skin', id);
        document.documentElement.setAttribute('data-skin', id);
        updateActiveSkin(id);
        
        const hasAuth = "{{ if $.User | hasAuth }}1{{ end }}" === "1";
        if (hasAuth) {
            fetch('/profile/skin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': window._CSRF || ''
                },
                body: JSON.stringify({ skin: id })
            }).catch(err => console.error('Failed to save skin preference to account:', err));
        }
    }

    function setDensity(id) {
        localStorage.setItem('octor-grid-density', id);
        document.documentElement.setAttribute('data-grid-density', id);
        updateActiveDensity(id);
        
        const hasAuth = "{{ if $.User | hasAuth }}1{{ end }}" === "1";
        if (hasAuth) {
            fetch('/profile/grid-density', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': window._CSRF || ''
                },
                body: JSON.stringify({ density: id })
            }).catch(err => console.error('Failed to save density preference to account:', err));
        }
    }

    function updateActiveSkin(id) {
        document.querySelectorAll('.skin-btn').forEach(btn => {
            const active = btn.getAttribute('data-skin-id') === id;
            btn.classList.toggle('border-o-primary', active);
            btn.classList.toggle('border-o-line', !active);
            btn.classList.toggle('ring-2', active);
            btn.classList.toggle('ring-o-primary', active);
            btn.classList.toggle('ring-offset-2', active);
            btn.classList.toggle('ring-offset-base-100', active);
        });
    }

    function updateActiveDensity(id) {
        document.querySelectorAll('.density-btn').forEach(btn => {
            const active = btn.getAttribute('data-density-id') === id;
            btn.classList.toggle('border-o-primary', active);
            btn.classList.toggle('border-o-line', !active);
            btn.classList.toggle('bg-o-primary/5', active);
        });
    }

    // Initial state
    (function() {
        const dbSkin = "{{ if $.User | hasAuth }}{{ $.User.Skin }}{{ end }}";
        const currentSkin = dbSkin || localStorage.getItem('octor-skin') || 'linear';
        updateActiveSkin(currentSkin);

        const dbDensity = "{{ if $.User | hasAuth }}{{ $.User.GridDensity }}{{ end }}";
        const currentDensity = dbDensity || localStorage.getItem('octor-grid-density') || 'default';
        updateActiveDensity(currentDensity);
    })();
</script>

<style>
    .text-shadow { text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
</style>
{{ end }}
