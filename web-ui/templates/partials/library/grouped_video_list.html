{{ define "library/grouped_video_list" }}
<div class="space-y-12">
    {{ range $.Data }}
    <div class="group-section">
        <div class="flex items-center gap-4 mb-6">
            {{ if .PosterURL }}
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-o-purple/30 flex-shrink-0">
                <img src="{{ .PosterURL }}" class="w-full h-full object-cover" alt="{{ .Title }}" />
            </div>
            {{ else }}
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-base-300 border-2 border-o-line flex-shrink-0 flex items-center justify-center text-o-muted">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            {{ end }}
            <div>
                <h2 class="text-xl sm:text-2xl font-bold text-w-text">{{ .Title }}</h2>
                <p class="text-sm text-o-muted">{{ len .Items }} {{ t $.Ctx.Lang "library.items" }}</p>
            </div>
        </div>
        {{ template "library/video_list" (withContext $.Ctx .Items) }}
    </div>
    {{ end }}
</div>
{{ end }}
