{{ define "library/button" }}
    {{ if .Ctx.User | hasAuth }}
        {{ with .Data }}
            {{ if .InLibrary }}
                <div class="flex items-center gap-1">
                    <form method="post" enctype="multipart/form-data" data-async-push-state="false" action="{{ langPath $.Ctx.Lang "/lib/remove" }}" data-async-target="#library-button">
                        <input type="hidden" name="resource_id" value="{{ .ID }}" />
                        <button type="submit" class="btn btn-ghost btn-sm text-o-primaryL hover:bg-o-primary/10 whitespace-nowrap">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m3 3 1.664 1.664M21 21l-1.5-1.5m-5.485-1.242L12 17.25 4.5 21V8.742m.164-4.078a2.15 2.15 0 0 1 1.743-1.342 48.507 48.507 0 0 1 11.186 0c1.1.128 1.907 1.077 1.907 2.185V19.5M4.664 4.664 19.5 19.5" />
                            </svg>
                            {{ t $.Ctx.Lang "library.removeFromLibrary" }}
                        </button>
                    </form>
                    {{/* Per-item metadata refresh — admin only */}}
                    {{ if $.Ctx.IsAdmin }}
                    <form method="post" data-async-push-state="false" action="{{ langPath $.Ctx.Lang "/lib/" }}{{ .ID }}/enrich" data-async-target="#library-button">
                        <button type="submit" class="btn btn-ghost btn-sm text-o-muted hover:text-o-primary" title="Refresh metadata">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                            </svg>
                        </button>
                    </form>
                    {{ end }}
                </div>
            {{ else }}
                <form method="post" enctype="multipart/form-data" data-async-push-state="false" action="{{ langPath $.Ctx.Lang "/lib/add" }}" data-async-target="#library-button">
                    <input type="hidden" name="resource_id" value="{{ .ID }}" />
                    <button type="submit" class="btn btn-soft btn-sm whitespace-nowrap" data-umami-event="add-to-library">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
                        </svg>
                        {{ t $.Ctx.Lang "library.addToLibrary" }}
                    </button>
                </form>
            {{ end }}
        {{ end }}
    {{ else }}
        <a href="{{ langPath .Ctx.Lang "/login" }}?from=library&return-url={{ langPath .Ctx.Lang .Ctx.Path }}" class="btn btn-soft btn-sm whitespace-nowrap" data-umami-event="add-to-library-anonymous" data-async-target="main">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
            </svg>
            {{ t $.Ctx.Lang "library.addToLibrary" }}
        </a>
    {{ end }}
{{ end }}
