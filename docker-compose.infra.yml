services:
  postgres:
    image: postgres:16-alpine
    container_name: octor-postgres
    environment:
      - POSTGRES_USER=webtor
      - POSTGRES_PASSWORD=webtor
      - POSTGRES_DB=webtor
    ports:
      - "5433:5432"
    volumes:
      - ./infra-data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    image: redis:7-alpine
    container_name: octor-redis
    ports:
      - "6380:6379"
    volumes:
      - ./infra-data/redis:/data

  nats:
    image: nats:2-alpine
    container_name: octor-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio
    container_name: octor-minio
    ports:
      - "9090:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=octoradmin
      - MINIO_ROOT_PASSWORD=octorpassword
    volumes:
      - ./infra-data/minio:/data
    command: server /data --console-address ":9001"
