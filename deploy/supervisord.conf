[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:octor-ai-proxy]
command=node ai-proxy/proxy.js
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-ai-proxy.log
stderr_logfile=/var/log/supervisor/octor-ai-proxy.err.log

[program:octor-sidecar]
command=/app/sidecar/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
directory=sidecar
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-sidecar.log
stderr_logfile=/var/log/supervisor/octor-sidecar.err.log

[program:octor-rest-api]
command=/bin/bash -c "exec bin/rest-api serve --port 8080 --pprof-port 51080 --probe-port 52080 --export-domain $OCTOR_DOMAIN --torrent-store-host 127.0.0.1 --torrent-store-port 50051 --magnet2torrent-host 127.0.0.1 --magnet2torrent-port 50053 --video-info-host 127.0.0.1 --video-info-port 50056 --export-use-subdomains false"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-rest-api.log
stderr_logfile=/var/log/supervisor/octor-rest-api.err.log

[program:octor-web-ui]
command=/bin/bash -c "exec /app/bin/web-ui serve --port 8082 --pprof-port 51081 --probe-port 52081 --octor-rest-api-host localhost --octor-rest-api-port 8080 --vault-service-host localhost --vault-service-port 8086 --use-internal-torrent-http-proxy=true --torrent-http-proxy-host localhost --torrent-http-proxy-port 50052 --domain $OCTOR_DOMAIN"
directory=web-ui
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-web-ui.log
stderr_logfile=/var/log/supervisor/octor-web-ui.err.log

[program:octor-vault]
command=/bin/bash -c "exec /app/bin/vault serve --port 8086 --pprof-port 51086 --probe-port 52086 --prom-port 53086 --octor-rest-api-host localhost --octor-rest-api-port 8080 --aws-endpoint $AWS_ENDPOINT --aws-region $AWS_REGION --aws-access-key-id $AWS_ACCESS_KEY_ID --aws-secret-access-key $AWS_SECRET_ACCESS_KEY --aws-bucket $VAULT_AWS_BUCKET --aws-no-ssl --max-concurrent-jobs $VAULT_MAX_CONCURRENT_JOBS --postgres-database vault"
directory=vault
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-vault.log
stderr_logfile=/var/log/supervisor/octor-vault.err.log

[program:octor-abuse-store]
command=/app/bin/abuse-store serve --grpc-port 50059 --pprof-port 51059 --probe-port 52059 --postgres-database abuse_store
directory=abuse-store
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-abuse-store.log
stderr_logfile=/var/log/supervisor/octor-abuse-store.err.log

[program:octor-claims-provider]
command=/app/bin/claims-provider serve --grpc-port 50060 --pprof-port 51060 --probe-port 52060 --prom-port 53060 --postgres-database claims_provider
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-claims-provider.log
stderr_logfile=/var/log/supervisor/octor-claims-provider.err.log

[program:octor-torrent-store]
command=/bin/bash -c "exec /app/bin/torrent-store serve --grpc-port 50051 --pprof-port 51051 --probe-port 52051 --abuse-host 127.0.0.1 --abuse-port 50059 --use-abuse --use-s3 --aws-endpoint $AWS_ENDPOINT --aws-access-key-id $AWS_ACCESS_KEY_ID --aws-secret-access-key $AWS_SECRET_ACCESS_KEY --aws-bucket $TORRENT_STORE_AWS_BUCKET --aws-region $AWS_REGION --aws-no-ssl"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-torrent-store.log
stderr_logfile=/var/log/supervisor/octor-torrent-store.err.log

[program:octor-magnet2torrent]
command=/app/bin/magnet2torrent --port 50053 --pprof-port 51053 --probe-port 52053
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-magnet2torrent.log
stderr_logfile=/var/log/supervisor/octor-magnet2torrent.err.log

[program:octor-url-store]
command=/app/bin/url-store serve --port 54061 --grpc-port 50061 --probe-port 52061 --postgres-database url_store
directory=url-store
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-url-store.log
stderr_logfile=/var/log/supervisor/octor-url-store.err.log

[program:octor-torrent-web-seeder]
command=/app/bin/torrent-web-seeder --port 50054 --pprof-port 51054 --probe-port 52054 --prom-port 53054
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-torrent-web-seeder.log
stderr_logfile=/var/log/supervisor/octor-torrent-web-seeder.err.log

[program:octor-torrent-web-seeder-cleaner]
command=/app/bin/torrent-web-seeder-cleaner serve
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-torrent-web-seeder-cleaner.log
stderr_logfile=/var/log/supervisor/octor-torrent-web-seeder-cleaner.err.log

[program:octor-content-transcoder]
command=/app/bin/content-transcoder --port 50055 --pprof-port 51055 --probe-port 52055
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-content-transcoder.log
stderr_logfile=/var/log/supervisor/octor-content-transcoder.err.log

[program:octor-video-info]
command=/bin/bash -c "exec /app/bin/video-info --port 50056 --probe-port 52056 --redis-host $REDIS_HOST --redis-port $REDIS_PORT"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-video-info.log
stderr_logfile=/var/log/supervisor/octor-video-info.err.log

[program:octor-torrent-archiver]
command=/app/bin/torrent-archiver --port 50057 --pprof-port 51057 --probe-port 52057 --torrent-store-host localhost --torrent-store-port 50051 --prom-port 53057
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-torrent-archiver.log
stderr_logfile=/var/log/supervisor/octor-torrent-archiver.err.log

[program:octor-srt2vtt]
command=/app/bin/srt2vtt --port 50058 --probe-port 52058
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-srt2vtt.log
stderr_logfile=/var/log/supervisor/octor-srt2vtt.err.log

[program:octor-content-prober]
command=/bin/bash -c "exec /app/bin/content-prober --port 50063 --http-port 50062 --probe-port 52062 --redis-host $REDIS_HOST --redis-port $REDIS_PORT --cache-ttl-days $ENRICH_CACHE_TTL_DAYS"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-content-prober.log
stderr_logfile=/var/log/supervisor/octor-content-prober.err.log

[program:octor-torrent-http-proxy]
command=/app/bin/torrent-http-proxy --port 50052 --torrent-http-proxy-host 127.0.0.1 --torrent-http-proxy-port 50052 --pprof-port 51052 --probe-port 52052 --config services.yaml
directory=torrent-http-proxy
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-torrent-http-proxy.log
stderr_logfile=/var/log/supervisor/octor-torrent-http-proxy.err.log

[program:octor-s3-gateway]
command=/app/bin/s3-gateway
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octor-s3-gateway.log
stderr_logfile=/var/log/supervisor/octor-s3-gateway.err.log
